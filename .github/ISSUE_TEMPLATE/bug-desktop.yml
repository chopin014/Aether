name: Aether bug report
description: Report a problem with Aether.
labels: [T-Defect, A-Electron]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this bug report!

              Include steps to reproduce and remove account tokens or private messages from attached logs.
    - type: textarea
      id: reproduction-steps
      attributes:
          label: Steps to reproduce
          description: Please attach screenshots, videos or logs if you can.
          placeholder: Tell us what you see!
          value: |
              1. Where are you starting? What can you see?
              2. What do you click?
              3. More steps…
      validations:
          required: true
    - type: textarea
      id: result
      attributes:
          label: Outcome
          placeholder: Tell us what went wrong
          value: |
              #### What did you expect?

              #### What happened instead?
      validations:
          required: true
    - type: input
      id: os
      attributes:
          label: Operating system
          placeholder: Windows, macOS, Ubuntu, Arch Linux…
      validations:
          required: false
    - type: input
      id: version
      attributes:
          label: Application version
          description: You can find the version information in Settings -> Help & About.
          placeholder: e.g. Aether 0.1.0 or a source commit
      validations:
          required: false
    - type: input
      id: source
      attributes:
          label: How did you install the app?
          description: Where did you install the app from? Please give a link or a description.
          placeholder: e.g. GitHub release AppImage, Windows installer, or built from source
      validations:
          required: false
    - type: input
      id: homeserver
      attributes:
          label: Homeserver
          description: |
              Which server is your account registered on? If it is a local or non-public homeserver, please tell us what is the homeserver implementation (ex: Synapse/Dendrite/etc.) and the version.
          placeholder: e.g. matrix.org or Synapse 1.50.0rc1
      validations:
          required: false
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs
          description: Paste relevant diagnostic output after removing tokens and private information.
          render: text
      validations:
          required: false
